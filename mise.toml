[settings]
quiet = true
task_output = "interleave"
experimental = true

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
node = "22"
"npm:patchright" = "1.58"
jq = "1.8.1"
"1password-cli" = "2.32.0"
"aqua:shenwei356/rush" = "0.9.0"
bats = "1.13.0"
gum = "0.17.0"
usage = "1"
"shiv:codebase" = "0.4"
"shiv:readme" = "0.3"

[_.codebase]
name = "browser"
lint = ["@all"]
